<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medal Table Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19; /* Deep navy background */
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 0.5rem;
            border: 1px solid #1e293b;
            background-color: #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: transparent;
        }

        th, td {
            padding: 0.5rem 0.75rem; 
            border-bottom: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
            font-size: 0.875rem; 
        }

        td {
            text-align: right;
            white-space: nowrap; /* Keeps data strictly on one line */
        }

        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            background-color: #0f172a; 
            z-index: 10;
            border-right: 2px solid #1e293b;
            white-space: nowrap; 
        }
        
        td:first-child {
            text-align: left;
        }

        th {
            background-color: #0f172a;
            color: #9ca3af;
            font-weight: 600;
            font-size: 0.875rem;
            position: sticky;
            top: 0;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
            white-space: normal; /* Allows headers to wrap */
            vertical-align: bottom;
            line-height: 1.25;
            text-align: center; /* Centers the header text */
        }

        th:hover {
            background-color: #1e293b;
            color: #f8fafc;
        }

        /* Sort Icons */
        .sort-icon {
            display: inline-block;
            margin-left: 0.25rem;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Tooltip Container */
        .info-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #475569;
            color: white;
            font-size: 10px;
            font-weight: bold;
            margin-left: 6px;
            cursor: help;
            position: relative;
        }
        
        .info-icon:hover {
            background-color: #94a3b8;
        }

        .info-icon .tooltip {
            visibility: hidden;
            width: max-content;
            background-color: #1e293b;
            color: #f8fafc;
            text-align: center;
            border-radius: 6px;
            padding: 8px 12px;
            position: absolute;
            z-index: 30;
            top: 100%; /* Push tooltip BELOW the icon */
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px; /* Space between icon and tooltip */
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 12px;
            font-weight: normal;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            white-space: pre-line;
            pointer-events: none;
        }

        .info-icon:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        /* Downward Triangle pointer */
        .info-icon .tooltip::after {
            content: "";
            position: absolute;
            bottom: 100%; /* Arrow pointing UP from the top of the tooltip */
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent #1e293b transparent;
        }

        /* Medal Colors - Adjusted to exact dark theme references */
        .gold { background-color: #facc15 !important; color: #000 !important; font-weight: 500; }
        .silver { background-color: #94a3b8 !important; color: #000 !important; font-weight: 500; }
        .score-col { background-color: #064e3b !important; color: #a7f3d0 !important; font-weight: bold; }
        .agent-name { font-weight: 500; color: #e2e8f0; }

        /* Navigation Buttons */
        .nav-btn {
            background-color: #1e293b;
            color: #9ca3af;
            transition: all 0.2s;
        }
        .nav-btn.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }
        .nav-btn:hover:not(.active) {
            background-color: #334155;
            color: white;
        }
    </style>
</head>

            if (val === null || val === "") return 0;

        function updateDateOptions() {
            const dateSelect = document.getElementById('date-select');
            dateSelect.innerHTML = '';
            
            let dates = new Set();
            if (currentTeam === 'family') {
                ['team1', 'team2', 'team3'].forEach(team => {
                    if (allData[team] && allData[team][currentView]) {
                        Object.keys(allData[team][currentView]).forEach(d => dates.add(d));
                    }
                });
            } else {
                dates = new Set(Object.keys(allData[currentTeam][currentView] || {}));
            }
            
            // Sort dates to maintain order
            const sortedDates = Array.from(dates).sort((a, b) => {
                const [dayA, monthA, yearA] = a.split('/');
                const [dayB, monthB, yearB] = b.split('/');
                return new Date(yearB, monthB - 1, dayB) - new Date(yearA, monthA - 1, dayA); // Descending
            });

            sortedDates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = date;
                dateSelect.appendChild(option);
            });
        }

        function setTeam(team) {
            currentTeam = team;
            document.querySelectorAll('#team-toggles button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${team}`).classList.add('active');
            updateDateOptions();
            renderTable();
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('#view-toggles button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${view}`).classList.add('active');
            updateDateOptions();
            renderTable();
        }

        function sortTable(colIndex) {
            if (sortCol === colIndex) {
                sortAsc = !sortAsc;
            } else {
                sortCol = colIndex;
                sortAsc = true;
            }
            renderTable(true);
        }

        function renderTable(isSort = false) {
            const dateSelect = document.getElementById('date-select');
            const selectedDate = dateSelect.value;
            
            if (!selectedDate) {
                document.getElementById('table-head').innerHTML = '';
                document.getElementById('table-body').innerHTML = '<tr><td colspan="12" class="text-center py-4 text-slate-500">No data available for this selection</td></tr>';
                return;
            }

            const headers = allData['team1'].headers;
            let rows = [];

            // Merge logic for Family view vs Single Team view
            if (currentTeam === 'family') {
                ['team1', 'team2', 'team3'].forEach(team => {
                    if (allData[team] && allData[team][currentView] && allData[team][currentView][selectedDate]) {
                        let teamName = team === 'team1' ? 'LDN5' : (team === 'team2' ? 'LDN7' : 'LDN10');
                        let teamRows = allData[team][currentView][selectedDate].map(row => {
                            let newRow = [...row];
                            // Append the team name so it is obvious who belongs where in the master list
                            newRow[0] = newRow[0] + ' (' + teamName + ')';
                            return newRow;
                        });
                        rows = rows.concat(teamRows);
                    }
                });
            } else {
                rows = [...allData[currentTeam][currentView][selectedDate]];
            }

            // Sorting logic
            if (sortCol > -1) {
                rows.sort((a, b) => {
                    let valA = a[sortCol];
                    let valB = b[sortCol];
                    
                    if (valA === "" || valA === null) valA = -999999;
                    if (valB === "" || valB === null) valB = -999999;

                    if (sortCol > 0 && sortCol < headers.length - 1) {
                        valA = parseFloat(valA);
                        valB = parseFloat(valB);
                    } else if (sortCol === headers.length - 1) {
                        valA = parseInt(valA);
                        valB = parseInt(valB);
                    }

                    if (valA < valB) return sortAsc ? -1 : 1;
                    if (valA > valB) return sortAsc ? 1 : -1;
                    return 0;
                });
            } else if (!isSort) {
                // Default sort by Score descending
                const scoreIndex = headers.length - 1;
                rows.sort((a, b) => parseInt(b[scoreIndex]) - parseInt(a[scoreIndex]));
            }

            // Render Headers
            const head = document.getElementById('table-head');
            head.innerHTML = '';
            const headerRow = document.createElement('tr');
            
            headers.forEach((headerText, index) => {
                const th = document.createElement('th');
                th.onclick = () => sortTable(index);
                th.title = "Click to sort";

                if (headerText.includes("Comp")) {
                    th.style.minWidth = "120px";
                }
                
                let displayText = headerText
                    .replace("Progressive Diff", "Progressive<br>Diff")
                    .replace("Response Time (BH)", "Response&nbsp;Time<br>(BH)")
                    .replace("Response Time", "Response&nbsp;Time")
                    .replace("Comp 4-16w", "Complaints<br>4-16w")
                    .replace("Comp 16-26w", "Complaints<br>16-26w")
                    .replace("Comp 6m+", "Complaints<br>6m+")
                    .replace("Inks sent", "Inks&nbsp;sent")
                    .replace("Calls taken", "Calls&nbsp;taken")
                    .replace("Phone CHI", "Phone&nbsp;CHI")
                    .replace("Email CHI", "Email&nbsp;CHI");

                const textSpan = document.createElement('span');
                textSpan.innerHTML = displayText;
                th.appendChild(textSpan);

                const sortIcon = document.createElement('span');
                sortIcon.className = 'sort-icon';
                if (sortCol === index) {
                    sortIcon.innerHTML = sortAsc ? '▲' : '▼';
                } else {
                    sortIcon.innerHTML = '↕';
                }
                th.appendChild(sortIcon);

                let targetText = null;
                if (currentView === 'weekly' && weeklyTargets[headerText]) targetText = weeklyTargets[headerText];
                if (currentView === 'monthly' && monthlyTargets[headerText]) targetText = monthlyTargets[headerText];
                if (currentView === 'quarterly' && quarterlyTargets[headerText]) targetText = quarterlyTargets[headerText];

                if (targetText) {
                    const infoIcon = document.createElement('span');
                    infoIcon.className = 'info-icon';
                    infoIcon.innerHTML = 'i';
                    
                    const tooltip = document.createElement('span');
                    tooltip.className = 'tooltip';
                    tooltip.innerHTML = targetText;
                    
                    infoIcon.appendChild(tooltip);
                    th.appendChild(infoIcon);
                }

                headerRow.appendChild(th);
            });
            head.appendChild(headerRow);

            const body = document.getElementById('table-body');
            body.innerHTML = '';

            rows.forEach(rowData => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/50 transition-colors';
                
                rowData.forEach((cellData, index) => {
                    const td = document.createElement('td');
                    td.textContent = cellData;
                    
                    if (index === 0) {
                        td.className = 'agent-name';
                    } else if (index === headers.length - 1) {
                        td.className = 'score-col';
                    } else {
                        const colName = headers[index];
                        let val = cellData === "" ? null : parseFloat(cellData);
                        let score = 0;
                        
                        if (currentView === 'weekly') score = calculateWeeklyScore(val, colName);
                        else if (currentView === 'monthly') score = calculateMonthlyScore(val, colName);
                        else if (currentView === 'quarterly') score = calculateQuarterlyScore(val, colName);

                        if (score === 2 || (score === 4 && (colName === "Phone CHI" || colName === "Email CHI"))) {
                            td.classList.add('gold');
                        } else if (score === 1 || (score === 2 && (colName === "Phone CHI" || colName === "Email CHI"))) {
                            td.classList.add('silver');
                        } else if (val === null) {
                            td.textContent = ""; 
                        }
                    }
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
        }

        // Initialize with Family tab as default
        setTeam('family');
    </script>
</body>
</html>
