<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Performance Medal Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0c15;
            color: #8b92a0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }

        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-button {
            background-color: #0b0c15;
            color: #8b92a0;
            border: 2px solid #1a1c29;
            padding: 8px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-button:hover {
            border-color: #4b5563;
            color: #ffffff;
        }

        .tab-button.active {
            background-color: #1a1c29;
            border-color: #d9a416;
            color: #ffffff;
        }

        .week-selector {
            background-color: #0b0c15;
            color: #ffffff;
            border: 2px solid #1a1c29;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .week-selector:hover, .week-selector:focus {
            border-color: #4b5563;
        }

        .table-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            overflow-x: auto;
            border-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .styled-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.85rem;
            text-align: right;
            background-color: #0f111a;
            white-space: nowrap;
        }

        .styled-table th, .styled-table td {
            padding: 12px 12px;
            border: 1px solid #1a1c29;
            color: #ffffff;
        }

        .styled-table th {
            background-color: #161824;
            color: #94a0b8;
            font-weight: 600;
            font-size: 0.8rem;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .styled-table th:first-child {
            text-align: left;
        }

        .styled-table tbody tr {
            transition: background-color 0.2s;
        }

        .styled-table tbody td:first-child {
            text-align: left;
            background-color: #161824;
            color: #ffffff;
            font-weight: 600;
        }

        /* LOCKED HIGHLIGHT COLORS */
        .styled-table td.highlight-gold {
            background-color: #d9a416 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .styled-table td.highlight-silver {
            background-color: #cccccc !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .styled-table td.score-col {
            background-color: #aee6cd !important;
            color: #000000 !important;
            font-weight: bold;
        }

        /* Prevent hover from overriding the highlights */
        .styled-table tbody tr:hover td:not(.highlight-gold):not(.highlight-silver):not(.score-col):not(:first-child) {
            background-color: #1a1c29;
        }

        .styled-table th.asc::after {
            content: " ↑";
            color: #d9a416;
        }
        .styled-table th.desc::after {
            content: " ↓";
            color: #d9a416;
        }
    </style>
</head>

    <h1 id="pageTitle" class="text-4xl font-bold text-white mb-6 text-center">Weekly Performance Medal Table</h1>

    <!-- Team Selectors -->
    <div class="tab-container">
        <button id="btnTeam1" class="tab-button active" onclick="switchTeam('team1')">Team 1</button>
        <button id="btnTeam2" class="tab-button" onclick="switchTeam('team2')">Team 2</button>
    </div>

    <!-- View Selectors -->
    <div class="tab-container">
        <button id="btnWeekly" class="tab-button active" onclick="switchView('weekly')">Weekly View</button>
        <button id="btnMonthly" class="tab-button" onclick="switchView('monthly')">Monthly View</button>
    </div>

    <!-- Date Dropdown -->
    <div class="flex-center flex-col mb-4">
        <div class="flex-center">
            <label for="weekSelect" class="text-white mr-2 text-lg font-semibold">Select Date:</label>
            <select id="weekSelect" class="week-selector" onchange="renderTable()"></select>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">

            renderTable();
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('btnWeekly').classList.toggle('active', view === 'weekly');
            document.getElementById('btnMonthly').classList.toggle('active', view === 'monthly');
            document.getElementById('pageTitle').textContent = view === 'weekly' ? 'Weekly Performance Medal Table' : 'Monthly Performance Medal Table';
            
            populateDateDropdown();
            renderTable();
        }

        function populateDateDropdown() {
            const select = document.getElementById('weekSelect');
            select.innerHTML = '';
            
            const dataset = dataStore[currentTeam][currentView];
            for (const dateKey in dataset) {
                const option = document.createElement('option');
                option.value = dateKey;
                option.textContent = dateKey;
                select.appendChild(option);
            }
        }

        function parseVal(val) {
            if (val === "" || val === null || val === undefined) return null;
            let str = String(val).trim().replace(/,/g, '');
            if (str === "") return null;
            if (str.includes('%')) {
                return parseFloat(str.replace('%', '')) / 100;
            }
            let parsed = parseFloat(str);
            return isNaN(parsed) ? null : parsed;
        }

        // This ensures math works flawlessly regardless of which team is selected (and if they miss columns like Contribution %)
        function getCellScore(val, headerName, isMonthly) {
            let v = parseVal(val);
            if (v === null) return 0; 

            if (!isMonthly) {
                // WEEKLY FORMULAS
                if (headerName === "Inks sent") return (v >= 140 ? 2 : (v >= 100 ? 1 : 0));
                if (headerName === "Calls taken") return (v >= 100 ? 2 : (v >= 80 ? 1 : 0));
                if (headerName === "Progressive Diff") return (v >= 60 ? 2 : (v >= 40 ? 1 : 0));
                if (headerName === "Contribution %") return (v >= 0.10 ? 2 : (v >= 0.08 ? 1 : 0));
                if (headerName === "Phone CHI") return (v >= 0.75 ? 2 : (v >= 0.70 ? 1 : 0));
                if (headerName === "Email CHI") return (v >= 0.60 ? 2 : (v >= 0.55 ? 1 : 0));
                if (headerName === "TP Requests") return (v >= 50 ? 2 : (v >= 25 ? 1 : 0));
                if (headerName === "Response Time") return ((v >= 0.01 && v <= 6) ? 2 : ((v >= 6.01 && v <= 8) ? 1 : 0));
                if (headerName === "Comp 4-16w") return (v <= 2 ? 2 : (v === 3 ? 1 : 0));
                if (headerName === "Comp 16-26w") return (v === 0 ? 2 : (v === 1 ? 1 : 0));
                if (headerName === "Comp 6m+") return (v === 0 ? 2 : (v === 1 ? 1 : 0));
            } else {
                // MONTHLY FORMULAS
                if (headerName === "Inks sent") return (v >= 560 ? 2 : (v >= 400 ? 1 : 0));
                if (headerName === "Calls taken") return (v >= 400 ? 2 : (v >= 320 ? 1 : 0));
                if (headerName === "Progressive Diff") return (v >= 240 ? 2 : (v >= 160 ? 1 : 0));
                if (headerName === "Contribution %") return (v >= 0.10 ? 2 : (v >= 0.08 ? 1 : 0));
                if (headerName === "Phone CHI") return (v >= 0.75 ? 2 : (v >= 0.70 ? 1 : 0));
                if (headerName === "Email CHI") return (v >= 0.60 ? 2 : (v >= 0.55 ? 1 : 0));
                if (headerName === "TP Requests") return (v >= 200 ? 2 : (v >= 100 ? 1 : 0));
                if (headerName === "Response Time") return ((v >= 0.01 && v <= 6) ? 2 : ((v >= 6.01 && v <= 8) ? 1 : 0));
                if (headerName === "Comp 4-16w") return (v <= 2 ? 2 : (v === 3 ? 1 : 0));
                if (headerName === "Comp 16-26w") return (v === 0 ? 2 : (v === 1 ? 1 : 0));
                if (headerName === "Comp 6m+") return (v === 0 ? 2 : 0);
            }
            return 0;
        }

        function renderTable() {
            // First, dynamically build the table headers based on selected team
            const headerRow = document.getElementById('tableHeader');
            headerRow.innerHTML = '';
            currentHeaders = dataStore[currentTeam].headers;
            
            currentHeaders.forEach((headerText, index) => {
                const th = document.createElement('th');
                th.textContent = headerText;
                th.onclick = () => sortTable(index);
                
                // Add sorting indicator arrows
                if (sortCol === index) {
                    th.classList.add(sortAsc ? 'asc' : 'desc');
                }
                headerRow.appendChild(th);
            });
            
            const dateKey = document.getElementById('weekSelect').value;
            currentData = [...(dataStore[currentTeam][currentView][dateKey] || [])];
            
            if (sortCol !== -1) {
                currentData.sort((a, b) => {
                    let valA = a[sortCol];
                    let valB = b[sortCol];
                    
                    if (sortCol > 0) {
                        valA = parseVal(valA) ?? -999999;
                        valB = parseVal(valB) ?? -999999;
                        return sortAsc ? valA - valB : valB - valA;
                    } else {
                        return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    }
                });
            }

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const isMonthly = (currentView === 'monthly');

            currentData.forEach((rowData) => {
                const tr = document.createElement('tr');

                rowData.forEach((cellData, index) => {
                    const td = document.createElement('td');
                    td.textContent = cellData;
                    
                    // Identify the score column dynamically (it's always the last column)
                    if (index === currentHeaders.length - 1) { 
                        td.classList.add('score-col');
                    } else if (index > 0 && String(cellData).trim() !== "") { 
                        // Map the formula calculation to the EXACT header name so it ignores missing columns
                        const score = getCellScore(cellData, currentHeaders[index], isMonthly);
                        if (score === 2) td.classList.add('highlight-gold');
                        else if (score === 1) td.classList.add('highlight-silver');
                    }

                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
        }

        function sortTable(colIndex) {
            if (sortCol === colIndex) {
                sortAsc = !sortAsc;
            } else {
                sortCol = colIndex;
                sortAsc = true;
            }
            renderTable();
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            populateDateDropdown();
            switchTeam('team1'); 
        });
    </script>
</body>
</html>
