<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medal Table Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 0.5rem;
            border: 1px solid #1e293b;
            background-color: #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: transparent;
        }

        th, td {
            padding: 0.5rem 0.75rem; 
            border-bottom: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
            font-size: 0.875rem; 
        }

        td {
            text-align: right;
            white-space: nowrap; 
        }

        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            background-color: #0f172a; 
            z-index: 10;
            border-right: 2px solid #1e293b;
            white-space: nowrap; 
        }
        
        td:first-child {
            text-align: left;
        }

        th {
            background-color: #0f172a;
            color: #9ca3af;
            font-weight: 600;
            font-size: 0.875rem;
            position: sticky;
            top: 0;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
            white-space: normal; 
            vertical-align: bottom;
            line-height: 1.25;
            text-align: center; 
        }

        th:hover {
            background-color: #1e293b;
            color: #f8fafc;
        }

        .sort-icon {
            display: inline-block;
            margin-left: 0.25rem;
            font-size: 0.75rem;
            color: #64748b;
        }

        .gold { background-color: #facc15 !important; color: #000 !important; font-weight: 500; }
        .silver { background-color: #94a3b8 !important; color: #000 !important; font-weight: 500; }
        .score-col { background-color: #064e3b !important; color: #a7f3d0 !important; font-weight: bold; }
        .agent-name { font-weight: 500; color: #e2e8f0; }

        .nav-btn {
            background-color: #1e293b;
            color: #9ca3af;
            transition: all 0.2s;
        }
        .nav-btn.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }
        .nav-btn:hover:not(.active) {
            background-color: #334155;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 text-sm">

        <h1 class="text-3xl font-bold text-center mb-8 text-white tracking-tight">Performance Medal Table</h1>
        
        <div class="flex flex-col items-center gap-6 mb-8">
            <div class="flex gap-2 p-1 bg-slate-800 rounded-lg flex-wrap justify-center" id="team-toggles">
                <button onclick="setTeam('team1')" class="nav-btn px-6 py-2 rounded-md font-medium" id="btn-team1">LDN5</button>
                <button onclick="setTeam('team2')" class="nav-btn px-6 py-2 rounded-md font-medium" id="btn-team2">LDN7</button>
                <button onclick="setTeam('team3')" class="nav-btn px-6 py-2 rounded-md font-medium" id="btn-team3">LDN10</button>
                <button onclick="setTeam('family')" class="nav-btn px-6 py-2 rounded-md font-medium" id="btn-family">Family</button>
            </div>
            
            <div class="flex gap-2 p-1 bg-slate-800 rounded-lg flex-wrap justify-center" id="view-toggles">
                <button onclick="setView('weekly')" class="nav-btn px-6 py-2 rounded-md font-medium" id="btn-weekly">Weekly View</button>
                <button onclick="setView('monthly')" class="nav-btn px-6 py-2 rounded-md font-medium" id="btn-monthly">Monthly View</button>
                <button onclick="setView('quarterly')" class="nav-btn px-6 py-2 rounded-md font-medium" id="btn-quarterly">Quarterly View</button>
            </div>

            <div class="flex items-center gap-3 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                <label for="date-select" class="font-medium text-slate-300">Select Date:</label>
                <select id="date-select" onchange="renderTable()" class="bg-slate-900 border border-slate-600 text-white text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2 outline-none">
                </select>
            </div>
        </div>

        <div class="table-container">
            <table id="medal-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        function updateDateOptions() {
            const dateSelect = document.getElementById('date-select');
            dateSelect.innerHTML = '';
            
            let dates = new Set();
            if (currentTeam === 'family') {
                ['team1', 'team2', 'team3'].forEach(team => {
                    if (allData[team] && allData[team][currentView]) {
                        Object.keys(allData[team][currentView]).forEach(d => dates.add(d));
                    }
                });
            } else {
                dates = new Set(Object.keys(allData[currentTeam][currentView] || {}));
            }
            
            const sortedDates = Array.from(dates).sort((a, b) => {
                const [dayA, monthA, yearA] = a.split('/');
                const [dayB, monthB, yearB] = b.split('/');
                return new Date(yearB, monthB - 1, dayB) - new Date(yearA, monthA - 1, dayA);
            });

            sortedDates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = date;
                dateSelect.appendChild(option);
            });
        }

        function setTeam(team) {
            currentTeam = team;
            document.querySelectorAll('#team-toggles button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${team}`).classList.add('active');
            updateDateOptions();
            renderTable();
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('#view-toggles button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${view}`).classList.add('active');
            updateDateOptions();
            renderTable();
        }

        function sortTable(colIndex) {
            if (sortCol === colIndex) {
                sortAsc = !sortAsc;
            } else {
                sortCol = colIndex;
                sortAsc = true;
            }
            renderTable(true);
        }

        function renderTable(isSort = false) {
            const dateSelect = document.getElementById('date-select');
            const selectedDate = dateSelect.value;
            
            if (!selectedDate) {
                document.getElementById('table-head').innerHTML = '';
                document.getElementById('table-body').innerHTML = '<tr><td colspan="12" class="text-center py-4 text-slate-500">No data available for this selection</td></tr>';
                return;
            }

            const headers = allData['team1'].headers;
            let rows = [];

            if (currentTeam === 'family') {
                ['team1', 'team2', 'team3'].forEach(team => {
                    if (allData[team] && allData[team][currentView] && allData[team][currentView][selectedDate]) {
                        let teamName = team === 'team1' ? 'LDN5' : (team === 'team2' ? 'LDN7' : 'LDN10');
                        let teamRows = allData[team][currentView][selectedDate].map(row => {
                            let newRow = [...row];
                            newRow[0] = newRow[0] + ' (' + teamName + ')';
                            return newRow;
                        });
                        rows = rows.concat(teamRows);
                    }
                });
            } else {
                rows = [...allData[currentTeam][currentView][selectedDate]];
            }

            if (sortCol > -1) {
                rows.sort((a, b) => {
                    let valA = a[sortCol];
                    let valB = b[sortCol];
                    
                    if (valA === "" || valA === null) valA = -999999;
                    if (valB === "" || valB === null) valB = -999999;

                    if (sortCol > 0 && sortCol < headers.length - 1) {
                        valA = parseFloat(valA);
                        valB = parseFloat(valB);
                    } else if (sortCol === headers.length - 1) {
                        valA = parseInt(valA);
                        valB = parseInt(valB);
                    }

                    if (valA < valB) return sortAsc ? -1 : 1;
                    if (valA > valB) return sortAsc ? 1 : -1;
                    return 0;
                });
            } else if (!isSort) {
                const scoreIndex = headers.length - 1;
                rows.sort((a, b) => parseInt(b[scoreIndex]) - parseInt(a[scoreIndex]));
            }

            const head = document.getElementById('table-head');
            head.innerHTML = '';
            const headerRow = document.createElement('tr');
            
            headers.forEach((headerText, index) => {
                const th = document.createElement('th');
                th.onclick = () => sortTable(index);
                th.title = "Click to sort";

                if (headerText.includes("Comp")) {
                    th.style.minWidth = "120px";
                }
                
                let displayText = headerText
                    .replace("Progressive Diff", "Progressive<br>Difference")
                    .replace("Response Time (BH)", "Response&nbsp;Time<br>(BH)")
                    .replace("Response Time", "Response&nbsp;Time")
                    .replace("Comp 4-16 weeks", "Complaints<br>4-16 weeks")
                    .replace("Comp 16-26 weeks", "Complaints<br>16-26 weeks")
                    .replace("Comp 6m+", "Complaints<br>6+ months")
                    .replace("Inks sent", "Inks&nbsp;sent")
                    .replace("Calls taken", "Calls&nbsp;taken")
                    .replace("Phone CHI", "Phone&nbsp;CHI")
                    .replace("Email CHI", "Email&nbsp;CHI");

                const textSpan = document.createElement('span');
                textSpan.innerHTML = displayText;
                th.appendChild(textSpan);

                const sortIcon = document.createElement('span');
                sortIcon.className = 'sort-icon';
                if (sortCol === index) {
                    sortIcon.innerHTML = sortAsc ? '▲' : '▼';
                } else {
                    sortIcon.innerHTML = '↕';
                }
                th.appendChild(sortIcon);

                headerRow.appendChild(th);
            });
            head.appendChild(headerRow);

            const body = document.getElementById('table-body');
            body.innerHTML = '';

            rows.forEach(rowData => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/50 transition-colors';
                
                rowData.forEach((cellData, index) => {
                    const td = document.createElement('td');
                    td.textContent = cellData;
                    
                    if (index === 0) {
                        td.className = 'agent-name';
                    } else if (index === headers.length - 1) {
                        td.className = 'score-col';
                    } else {
                        const colName = headers[index];
                        let val = cellData === "" ? null : parseFloat(cellData);
                        
                        const isChi = (colName === "Phone CHI" || colName === "Email CHI");
                        const isComp = colName.startsWith("Comp");
                        
                        if (val !== null) {
                            if (isChi) {
                                if (val >= 0.6) td.classList.add('gold');
                                else if (val >= 0.55 && val < 0.6) td.classList.add('silver');
                            } else if (isComp) {
                                if (val === 0) td.classList.add('gold');
                                else if (val > 0) td.classList.add('silver');
                            } else {
                                if (colName === "Inks sent" && val > 150) td.classList.add('gold');
                                else if (colName === "Calls taken" && val > 100) td.classList.add('gold');
                                else if (colName === "Progressive Diff" && val > 50) td.classList.add('gold');
                                else if (colName === "TP Requests" && val > 40) td.classList.add('gold');
                            }
                        } else {
                            td.textContent = ""; 
                        }
                    }
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
        }

        setTeam('team1');
        setView('quarterly');
    </script>
</body>
</html>
