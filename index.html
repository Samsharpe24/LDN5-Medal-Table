    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1600px;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .tab-button {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .tab-button.active {
            background-color: #1f6feb;
            color: #ffffff;
            border-color: #1f6feb;
        }

        .week-selector-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
        }

        .week-selector {
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            outline: none;
        }

        .week-selector:hover, .week-selector:focus {
            border-color: #8b949e;
        }

        .table-container {
            width: 100%;
            max-width: 1600px;
            overflow-x: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #161b22;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #30363d;
        }

        th {
            background-color: #161b22;
            color: #8b949e;
            font-weight: 600;
            font-size: 13px;
            text-transform: capitalize;
            cursor: pointer;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th:hover {
            color: #c9d1d9;
        }
        
        th.sort-asc::after { content: " ↑"; }
        th.sort-desc::after { content: " ↓"; }

        td:first-child {
            text-align: left;
            font-weight: 600;
            color: #ffffff;
            background-color: #161b22;
            position: sticky;
            left: 0;
            z-index: 5;
        }

        td:last-child {
            font-weight: bold;
            text-align: center;
        }

        /* Highlight Colors */
        .bg-gold {
            background-color: #df9e10 !important;
            color: #000000 !important;
            font-weight: bold;
        }
        .bg-silver {
            background-color: #bcbcbc !important;
            color: #000000 !important;
            font-weight: bold;
        }
        .bg-score {
            background-color: #a8e6cf !important;
            color: #000000 !important;
        }

        /* Hover effect for rows */
        tbody tr:hover td {
            filter: brightness(1.2);
        }
        tbody tr:hover td.bg-gold, tbody tr:hover td.bg-silver, tbody tr:hover td.bg-score {
            filter: brightness(1.05);
        }
    </style>
</head>

        let currentTeam = 'team1';
        let currentView = 'weekly';
        let currentDate = '';
        let sortCol = -1;
        let sortAsc = true;

        function switchTeam(team) {
            currentTeam = team;
            document.getElementById('btnTeam1').classList.toggle('active', team === 'team1');
            document.getElementById('btnTeam2').classList.toggle('active', team === 'team2');
            document.getElementById('btnTeam3').classList.toggle('active', team === 'team3');
            populateDateDropdown();
            renderTable();
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('btnWeekly').classList.toggle('active', view === 'weekly');
            document.getElementById('btnMonthly').classList.toggle('active', view === 'monthly');
            populateDateDropdown();
            renderTable();
        }

        function populateDateDropdown() {
            const select = document.getElementById('dateSelect');
            select.innerHTML = '';
            
            const viewData = allData[currentTeam][currentView];
            if (!viewData) return;

            const dates = Object.keys(viewData);
            dates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = date;
                select.appendChild(option);
            });

            if (dates.length > 0) {
                if (!dates.includes(currentDate)) {
                    currentDate = dates[0];
                }
                select.value = currentDate;
            }
        }

        document.getElementById('dateSelect').addEventListener('change', (e) => {
            currentDate = e.target.value;
            renderTable();
        });

        function parseVal(val) {
            if (val === "" || val === null || val === undefined) return null;
            if (typeof val === 'string' && val.trim() === '') return null;
            
            let strVal = String(val).replace(/,/g, '');
            if (strVal.includes('%')) {
                return parseFloat(strVal.replace('%', '')) / 100;
            }
            return parseFloat(strVal);
        }

        function calculateWeeklyScore(val, colName) {
            if (val === null) return 0;
            
            if (colName === "Inks sent") return val >= 140 ? 2 : (val >= 100 ? 1 : 0);
            if (colName === "Calls taken") return val >= 100 ? 2 : (val >= 80 ? 1 : 0);
            if (colName === "Progressive Diff") return val >= 60 ? 2 : (val >= 40 ? 1 : 0);
            if (colName === "Contribution %") return val >= 0.1 ? 2 : (val >= 0.08 ? 1 : 0);
            if (colName === "Phone CHI") return val >= 0.75 ? 2 : (val >= 0.7 ? 1 : 0);
            if (colName === "Email CHI") return val >= 0.6 ? 2 : (val >= 0.55 ? 1 : 0);
            if (colName === "TP Requests") return val >= 50 ? 2 : (val >= 25 ? 1 : 0);
            
            if (colName === "Response Time") {
                if (val >= 0.01 && val <= 6) return 2;
                if (val >= 6.01 && val <= 8) return 1;
                return 0;
            }
            
            if (colName === "Comp 4-16w") return val <= 2 ? 2 : (val === 3 ? 1 : 0);
            if (colName === "Comp 16-26w") return val === 0 ? 2 : (val === 1 ? 1 : 0);
            if (colName === "Comp 6m+") return val === 0 ? 2 : (val === 1 ? 1 : 0);
            
            return 0;
        }

        function calculateMonthlyScore(val, colName) {
            if (val === null) return 0;
            
            if (colName === "Inks sent") return val >= 560 ? 2 : (val >= 400 ? 1 : 0);
            if (colName === "Calls taken") return val >= 400 ? 2 : (val >= 320 ? 1 : 0);
            if (colName === "Progressive Diff") return val >= 240 ? 2 : (val >= 160 ? 1 : 0);
            if (colName === "Contribution %") return val >= 0.1 ? 2 : (val >= 0.08 ? 1 : 0);
            if (colName === "Phone CHI") return val >= 0.75 ? 2 : (val >= 0.7 ? 1 : 0);
            if (colName === "Email CHI") return val >= 0.6 ? 2 : (val >= 0.55 ? 1 : 0);
            if (colName === "TP Requests") return val >= 200 ? 2 : (val >= 100 ? 1 : 0);
            
            if (colName === "Response Time") {
                if (val >= 0.01 && val <= 6) return 2;
                if (val >= 6.01 && val <= 8) return 1;
                return 0;
            }
            
            if (colName === "Comp 4-16w") return val <= 2 ? 2 : (val === 3 ? 1 : 0);
            if (colName === "Comp 16-26w") return val === 0 ? 2 : (val === 1 ? 1 : 0);
            if (colName === "Comp 6m+") return val === 0 ? 2 : 0; // No silver for Monthly 6m+
            
            return 0;
        }

        function sortTable(colIndex) {
            if (sortCol === colIndex) {
                sortAsc = !sortAsc;
            } else {
                sortCol = colIndex;
                sortAsc = false;
            }
            renderTable();
        }

        function renderTable() {
            const teamConfig = allData[currentTeam];
            const headers = teamConfig.headers;
            const dataSet = teamConfig[currentView][currentDate] || [];

            let displayData = [...dataSet];

            // Sorting execution
            if (sortCol > -1) {
                displayData.sort((a, b) => {
                    let valA = a[sortCol];
                    let valB = b[sortCol];
                    
                    let numA = parseVal(valA);
                    let numB = parseVal(valB);
                    
                    if (numA !== null && numB !== null) {
                        return sortAsc ? numA - numB : numB - numA;
                    }
                    return sortAsc ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                });
            }

            // Render Headers
            const thead = document.getElementById('tableHead');
            thead.innerHTML = '';
            const trHead = document.createElement('tr');
            headers.forEach((h, index) => {
                const th = document.createElement('th');
                th.textContent = h;
                th.onclick = () => sortTable(index);
                if (sortCol === index) {
                    th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
                }
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            // Render Body
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            displayData.forEach(row => {
                const tr = document.createElement('tr');
                
                row.forEach((cellData, index) => {
                    const td = document.createElement('td');
                    td.textContent = cellData;
                    
                    let colName = headers[index];
                    
                    // Skip styling for Agent name and Final Score
                    if (index > 0 && index < headers.length - 1) {
                        let numericVal = parseVal(cellData);
                        
                        let score = 0;
                        if (currentView === 'weekly') {
                            score = calculateWeeklyScore(numericVal, colName);
                        } else {
                            score = calculateMonthlyScore(numericVal, colName);
                        }

                        if (score === 2) {
                            td.classList.add('bg-gold');
                        } else if (score === 1) {
                            td.classList.add('bg-silver');
                        }
                    }

                    if (index === headers.length - 1) {
                        td.classList.add('bg-score');
                    }
                    
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        populateDateDropdown();
        renderTable();
