<html lang="en">
<head>

    <title>Weekly Performance Medal Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19; /* Deep navy from screenshot */
            color: #e2e8f0; /* Light slate text */
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            background-color: #0f172a;
            border: 1px solid #1e293b;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: transparent;
        }
        
        th, td {
            padding: 0.75rem 1rem;
            text-align: right;
            border-bottom: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
            white-space: nowrap;
        }
        
        th:first-child, td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background-color: #0f172a; /* Match table background */
            z-index: 10;
            border-right: 2px solid #1e293b;
        }
        
        th {
            background-color: #0f172a;
            color: #9ca3af;
            font-weight: 600;
            font-size: 0.875rem;
            position: sticky;
            top: 0;
            z-index: 20;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }
        
        th:hover {
            background-color: #1e293b;
            color: #f8fafc;
        }
        
        th:first-child {
            z-index: 30;
        }

        .bg-gold { background-color: #facc15 !important; color: #111827 !important; font-weight: 600; }
        .bg-silver { background-color: #94a3b8 !important; color: #111827 !important; font-weight: 600; }
        .bg-score { background-color: #065f46 !important; color: #a7f3d0 !important; font-weight: bold; } 
        
        .sort-icon {
            display: inline-block;
            margin-left: 4px;
            font-size: 0.85em;
            color: #4b5563;
        }
        .sort-icon.active {
            color: #38bdf8;
        }

        .info-icon {
            display: inline-block;
            margin-left: 6px;
            cursor: help;
            position: relative;
            background: #334155;
            color: #e2e8f0;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            text-align: center;
            line-height: 16px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .info-icon:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
        
        .info-icon .tooltip {
            visibility: hidden;
            width: max-content;
            background-color: #1e293b;
            color: #f8fafc;
            text-align: left;
            border-radius: 6px;
            padding: 8px 12px;
            position: absolute;
            z-index: 50;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px; /* Drops below the header */
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.75rem;
            font-weight: normal;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        
        .info-icon .tooltip::after {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent #1e293b transparent;
        }

        /* Nav Buttons Dark Theme Styles */
        .nav-btn-active {
            background-color: #2563eb !important;
            color: #ffffff !important;
        }
        .nav-btn-inactive {
            background-color: #1e293b !important;
            color: #94a3b8 !important;
        }
        .nav-btn-inactive:hover {
            background-color: #334155 !important;
            color: #f8fafc !important;
        }
    </style>
</head>

    function setTeam(teamId) {
        currentTeam = teamId;
        currentSort = { column: -1, direction: 'desc' };
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('nav-btn-active');
            btn.classList.add('nav-btn-inactive');
        });
        const activeBtn = document.getElementById(`btn-${teamId}`);
        activeBtn.classList.remove('nav-btn-inactive');
        activeBtn.classList.add('nav-btn-active');

        updateDateDropdown();
    }

    function setView(viewId) {
        currentView = viewId;
        currentSort = { column: -1, direction: 'desc' };
        
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.classList.remove('nav-btn-active');
            btn.classList.add('nav-btn-inactive');
        });
        const activeBtn = document.getElementById(`btn-view-${viewId}`);
        activeBtn.classList.remove('nav-btn-inactive');
        activeBtn.classList.add('nav-btn-active');

        updateDateDropdown();
    }

    function updateDateDropdown() {
        const dateSelect = document.getElementById('dateSelect');
        dateSelect.innerHTML = '';
        
        const dates = Object.keys(allData[currentTeam][currentView]);
        
        if (dates.length === 0) {
            const option = document.createElement('option');
            option.text = "No data available";
            dateSelect.add(option);
            renderTable();
            return;
        }

        dates.forEach(date => {
            const option = document.createElement('option');
            option.value = date;
            option.text = date;
            dateSelect.add(option);
        });

        renderTable();
    }

    function sortTable(columnIndex) {
        if (currentSort.column === columnIndex) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.column = columnIndex;
            currentSort.direction = 'desc';
        }
        renderTable();
    }

    function renderTable() {
        const selectedDate = document.getElementById('dateSelect').value;
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        
        tableHead.innerHTML = '';
        tableBody.innerHTML = '';

        if (!allData[currentTeam][currentView][selectedDate]) {
            tableBody.innerHTML = '<tr><td colspan="12" class="text-center py-4 text-slate-400">Select a valid date.</td></tr>';
            return;
        }

        const headers = allData[currentTeam].headers;
        let dataRows = [...allData[currentTeam][currentView][selectedDate]];
        
        // Handling the dynamic sort
        if (currentSort.column !== -1) {
            dataRows.sort((a, b) => {
                let valA = a[currentSort.column];
                let valB = b[currentSort.column];
                
                if (valA === "" || valA === null) valA = -Infinity;
                if (valB === "" || valB === null) valB = -Infinity;

                let numA = parseFloat(valA);
                let numB = parseFloat(valB);

                if (!isNaN(numA) && !isNaN(numB)) {
                    return currentSort.direction === 'asc' ? numA - numB : numB - numA;
                } else {
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                    if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                    return 0;
                }
            });
        }

        const activeTargets = targetConfig[currentView];

        // Building Headers
        const headerRow = document.createElement('tr');
        headers.forEach((headerText, index) => {
            const th = document.createElement('th');
            th.onclick = () => sortTable(index);
            th.title = "Click to sort";
            
            const textNode = document.createTextNode(headerText);
            th.appendChild(textNode);
            
            const sortIcon = document.createElement('span');
            sortIcon.className = 'sort-icon';
            if (currentSort.column === index) {
                sortIcon.innerHTML = currentSort.direction === 'asc' ? '▲' : '▼';
                sortIcon.classList.add('active');
            } else {
                sortIcon.innerHTML = '↕';
            }
            th.appendChild(sortIcon);
            
            if (activeTargets[headerText]) {
                const icon = document.createElement('span');
                icon.className = 'info-icon';
                icon.innerHTML = 'i<span class="tooltip">Gold: ' + activeTargets[headerText].gold + '<br>Silver: ' + (activeTargets[headerText].silver !== null ? activeTargets[headerText].silver : "N/A") + '</span>';
                icon.onclick = (e) => e.stopPropagation();
                th.appendChild(icon);
            }
            
            headerRow.appendChild(th);
        });
        tableHead.appendChild(headerRow);

        // Building Data Rows
        dataRows.forEach(rowData => {
            const row = document.createElement('tr');
            
            rowData.forEach((cellData, index) => {
                const td = document.createElement('td');
                td.textContent = cellData;
                
                // Color mapping excluding Name(0) and Score(last)
                if (index > 0 && index < rowData.length - 1) {
                    const colName = headers[index];
                    const medal = getMedalStatus(cellData, colName, currentView);

                    if (medal === 'gold') {
                        td.classList.add('bg-gold');
                    } else if (medal === 'silver') {
                        td.classList.add('bg-silver');
                    } 
                    // Blank/None defaults to transparent row background
                }

                // Final Score Column
                if (index === rowData.length - 1) {
                    td.classList.add('bg-score');
                }

                row.appendChild(td);
            });
            tableBody.appendChild(row);
        });
    }

    // Launch defaults on start
    window.onload = () => {
        setTeam('team1');
    };
